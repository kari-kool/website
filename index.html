<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kool Studio - Under Construction</title>

    <style>
      /* Reset */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        background: #18152a; /* mismo tono del fondo */
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }

      /* Page container */
      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      /* Mobile: centrar horizontal y “sentirlo” al centro */
      @media (max-width: 768px) {
        .page { align-items: center; padding: 24px 0; }
      }

      /* Frame (imagen + overlay) */
      .frame {
        width: min(1440px, 100vw);
        position: relative; /* clave para overlay */
      }

      .frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Área del embed EXACTA sobre el recuadro */
      .embed-area {
        position: absolute;
        left: 4%;
        top: 35.5%;
        width: 93%;
        height: 40%;

        border-radius: 10px;
        overflow: hidden;
        /* si quieres sombra suave, descomenta: */
        /* box-shadow: 0 2px 8px rgba(63,69,81,0.16); */
      }

      .embed-area iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* Ocultar el link de Canva si no lo quieres visible */
      .canva-credit {
        display: none;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="frame" aria-label="Landing image">
        <img src="desktop2.png" width="1440" height="1911" alt="Landing" />

        <!-- Embed dentro del recuadro blanco -->
        <div class="embed-area">
          <iframe
            loading="lazy"
            src="https://www.canva.com/design/DAGoqIwfUpU/aqXyOWxjvt-LWpLXLgPTuw/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen"
            title="Q2 2025 Portafolio_Kool 2"
          ></iframe>
        </div>

        <!-- Opcional (crédito Canva) -->
        <a
          class="canva-credit"
          href="https://www.canva.com/design/DAGoqIwfUpU/aqXyOWxjvt-LWpLXLgPTuw/view?utm_content=DAGoqIwfUpU&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
          target="_blank"
          rel="noopener"
        >
          Q2 2025 Portafolio_Kool 2
        </a>
      </section>
    </main>
  </body>
</html>
